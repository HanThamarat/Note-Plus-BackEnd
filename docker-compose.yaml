version: "3.8"

services:
  postgreSql:
    restart: always
    platform: linux/x86_64
    image: postgres:18-alpine3.22
    ports:
      - 5432:5432
    volumes:
      - database_valume:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=root
      - POSTGRES_DB=noteplus
    networks:
      - server
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  server:
    restart: always
    platform: linux/x86_64
    build:
      context: ./API-RECEIVE/
      dockerfile: ${DOCKERFILE:-Dockerfile.dev}
    working_dir: /app/API-RECEIVE
    command: "air -c .air.toml"
    ports:
      - 3000:3000
    volumes:
      - ./:/app
    networks:
      - server
    depends_on:
      postgreSql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  messagequeue-server:
    restart: always
    platform: linux/x86_64
    build:
      context: ./MESSAGE-QUEUE/
      dockerfile: ${DOCKERFILE:-Dockerfile.dev}
    working_dir: /app/MESSAGE-QUEUE
    command: "air -c .air.toml"
    ports:
      - 3004:3004
    volumes:
      - ./:/app
    networks:
      - server
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "root"
      RABBITMQ_DEFAULT_PASS: "root"
    restart: unless-stopped
    networks:
      - server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - rabbitmq_data:/data

networks:
  server:
    driver: bridge

volumes:
  rabbitmq_data:
  database_valume: